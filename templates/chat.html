<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 300px;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        .modal-content input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-content button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .modal-content button:hover {
            transform: translateY(-2px);
        }

        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .chat-container {
            display: none;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .main-layout {
            display: flex;
            height: calc(100vh - 80px);
        }

        .sidebar {
            width: 280px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .user-info {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .user-info h3 {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .user-name {
            font-weight: bold;
            color: #333;
            font-size: 18px;
        }

        .online-users {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .online-users h3 {
            margin-bottom: 15px;
            color: #333;
        }

        #usersList {
            list-style: none;
        }

        #usersList li {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(76, 175, 80, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0);
            }
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .username {
            font-weight: bold;
            color: #667eea;
        }

        .timestamp {
            color: #999;
        }

        .message-text {
            background: white;
            padding: 10px 15px;
            border-radius: 18px;
            display: inline-block;
            max-width: 70%;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .system-message {
            text-align: center;
            font-style: italic;
            color: #999;
            font-size: 12px;
            padding: 5px;
        }

        .typing-indicator {
            padding: 10px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #999;
            font-style: italic;
            height: 40px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
        }

        .leave-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .leave-btn:hover {
            background: #c82333;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>💬 Welcome to ChatApp</h2>
            <input type="text" id="usernameInput" placeholder="Enter your username" maxlength="20">
            <br>
            <div id="errorMsg" class="error-message"></div>
            <button onclick="joinChat()">Join Chat</button>
        </div>
    </div>

    <div id="chatContainer" class="chat-container">
        <div class="chat-header">
            <h1>💬 Real-Time Chat Application</h1>
            <p>Powered by Server-Sent Events</p>
        </div>
        <div class="main-layout">
            <div class="sidebar">
                <div class="user-info">
                    <h3>👤 Logged in as</h3>
                    <div class="user-name" id="currentUsername"></div>
                    <button class="leave-btn" onclick="leaveChat()">Leave Chat</button>
                </div>
                <div class="online-users">
                    <h3>🟢 Online Users</h3>
                    <ul id="usersList"></ul>
                </div>
            </div>
            <div class="chat-area">
                <div id="messages" class="messages-container"></div>
                <div id="typingIndicator" class="typing-indicator"></div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                    <button id="sendBtn" onclick="sendMessage()">Send ➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = '';
        let typingTimeout;
        let eventSource;
        let typingUsers = new Set();

        async function joinChat() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                showError('Please enter a username!');
                return;
            }

            try {
                const response = await fetch('/join', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username: username })
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                currentUser = data.username;
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('chatContainer').style.display = 'block';
                document.getElementById('currentUsername').textContent = currentUser;

                // Load existing messages
                if (data.messages) {
                    data.messages.forEach(msg => addMessage(msg));
                }

                // Update users list
                updateUsersList(data.users);

                // Start SSE connection
                startEventSource();

                // Scroll to bottom
                scrollToBottom();

            } catch (error) {
                showError('Connection error. Please try again.');
            }
        }

        function startEventSource() {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource('/stream');

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleEvent(data);
            };

            eventSource.onerror = function(error) {
                console.error('SSE Error:', error);
                // Reconnect after 3 seconds
                setTimeout(startEventSource, 3000);
            };
        }

        function handleEvent(event) {
            switch(event.type) {
                case 'new_message':
                    addMessage(event.data);
                    break;
                case 'user_joined':
                    addSystemMessage(`${event.data.username} joined the chat`);
                    updateUsersList(event.data.users);
                    break;
                case 'user_left':
                    addSystemMessage(`${event.data.username} left the chat`);
                    updateUsersList(event.data.users);
                    break;
                case 'user_typing':
                    updateTypingIndicator(event.data);
                    break;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text) return;

            try {
                await fetch('/send_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text })
                });

                input.value = '';
                input.focus();
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }

        async function leaveChat() {
            try {
                await fetch('/leave', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
            } catch (error) {
                console.error('Error leaving chat:', error);
            }
            
            if (eventSource) {
                eventSource.close();
            }
            
            location.reload();
        }

        function addMessage(data) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            if (data.system) {
                messageDiv.innerHTML = `<div class="system-message">${escapeHtml(data.text)}</div>`;
            } else {
                const isCurrentUser = data.username === currentUser;
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span class="username">${escapeHtml(data.username)}</span>
                        <span class="timestamp">${data.timestamp}</span>
                    </div>
                    <div class="message-text">${escapeHtml(data.text)}</div>
                `;
            }
            
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message';
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        function updateUsersList(users) {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="online-dot"></span>
                    <span>${escapeHtml(user)}</span>
                `;
                usersList.appendChild(li);
            });
        }

        function updateTypingIndicator(data) {
            const indicator = document.getElementById('typingIndicator');
            
            if (data.is_typing) {
                typingUsers.add(data.username);
            } else {
                typingUsers.delete(data.username);
            }
            
            if (typingUsers.size > 0) {
                const users = Array.from(typingUsers);
                if (users.length === 1) {
                    indicator.textContent = `${users[0]} is typing...`;
                } else if (users.length === 2) {
                    indicator.textContent = `${users[0]} and ${users[1]} are typing...`;
                } else {
                    indicator.textContent = `${users.length} people are typing...`;
                }
            } else {
                indicator.textContent = '';
            }
        }

        async function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            } else {
                // Send typing indicator
                try {
                    await fetch('/typing', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ is_typing: true })
                    });
                    
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(async () => {
                        await fetch('/typing', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ is_typing: false })
                        });
                    }, 1000);
                } catch (error) {
                    console.error('Error sending typing indicator:', error);
                }
            }
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (currentUser) {
                fetch('/leave', { method: 'POST', keepalive: true });
            }
        });
    </script>
</body>
</html>
